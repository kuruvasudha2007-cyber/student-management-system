<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div>
            <h1>School Management</h1>
            <p>Add a new student record</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="insert.html">Add Student</a>
            <a href="list.html">All Students</a>
            <a href="listOne.html">Find Student</a>
            <a href="update.html">Update</a>
            <a href="delete.html">Delete</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">

        <section class="form-card">

            <h2>Add New Student</h2>

            <p class="description">
                Enter the student details below.
            </p>

            <form id="studentForm">

                <div class="form-group">
                    <label for="sno">Student ID</label>
                    <input
                        type="number"
                        id="sno"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        maxlength="45"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="className">Class</label>
                    <input
                        type="number"
                        id="className"
                        min="1"
                        step="1"
                        placeholder="Enter class number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="total">Total Marks</label>
                    <input
                        type="number"
                        id="total"
                        min="0"
                        step="1"
                        required
                    >
                </div>

                <div class="actions">

                    <button
                        type="submit"
                        class="btn"
                        id="saveBtn"
                    >
                        Save Student
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

                <div
                    id="status"
                    class="status"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        School Student Management System
    </footer>

    <!-- JavaScript -->
    <script>
        const form = document.getElementById("studentForm");
        const button = document.getElementById("saveBtn");
        const statusBox = document.getElementById("status");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const sno = Number(document.getElementById("sno").value);
            const name = document.getElementById("name").value.trim();
            const studentClass = Number(
                document.getElementById("className").value
            );
            const total = Number(document.getElementById("total").value);

            if (
                !Number.isInteger(sno) ||
                sno < 1 ||
                !name ||
                !Number.isInteger(studentClass) ||
                studentClass < 1 ||
                !Number.isInteger(total) ||
                total < 0
            ) {
                showStatus(
                    "Please enter valid values in all fields.",
                    "error"
                );
                return;
            }

            button.disabled = true;
            button.textContent = "Saving...";

            showStatus("Saving student details...", "loading");

            try {
                const response = await fetch("/students", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        sno: sno,
                        name: name,
                        studentClass: studentClass,
                        total: total
                    })
                });

                const message = await response.text();

                if (!response.ok) {
                    throw new Error(
                        message || "Unable to save student details."
                    );
                }

                showStatus(
                    message || "Student added successfully!",
                    "success"
                );

                form.reset();

            } catch (error) {
                showStatus(error.message, "error");
                console.error("Error adding student:", error);

            } finally {
                button.disabled = false;
                button.textContent = "Save Student";
            }
        });

        function showStatus(message, type) {
            statusBox.textContent = message;
            statusBox.className = "status " + type;
        }
    </script>

</body>

</html>
